<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register | Digital Dreams ICT Academy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div id="toast" class="toast"></div>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">D</span>
        <span>DIGITAL DREAMS <small>ICT ACADEMY</small></span></a>
      
      <nav class="nav"><a href="/">Home</a><a href="login.html">Login</a></nav>
    </header>
    <main class="auth-wrap">
      <div class="auth-card wide">
        <span class="eyebrow">JOIN THE ACADEMY</span>
        <h1>Create your <em>student account.</em></h1>
        <p>Register your interest and get access to the student dashboard.</p>
        <form id="registerForm">
          <div class="two">
            <label
              >Full name<input
                name="name"
                required
                autocomplete="name" /></label>
            <label
              >Phone / WhatsApp<input name="phone" autocomplete="tel"/>
            </label>
          </div>
          <label>
            Email address<input
              type="email"
              name="email"
              required
              autocomplete="email" /></label>
          <label
            >Course of interest<select id="courseSelect" name="course">
              <option value="">Select a course</option>
            </select></label>
          
          <div class="two">
            <label
              >Password<input type="password" name="password"  minlength="6" required autocomplete="new-password" /></label>
            <label
              >Confirm password<input type="password"  name="confirmPassword" minlength="6" required autocomplete="new-password"/>
            </label>
          </div>
          <button class="btn btn-primary full" type="submit">
            Create Account
          </button>
        </form>
        <p class="auth-bottom">
          Already registered? <a href="./login.html">Login here</a>
        </p>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
